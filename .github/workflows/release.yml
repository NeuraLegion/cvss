name: Semantic release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GPR_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm ci -q
      
      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}
